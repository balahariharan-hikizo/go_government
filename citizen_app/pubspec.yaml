name: go_government
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  flutter_bloc: ^8.1.3
  equatable: ^2.1.0
  mobile_scanner: ^7.4.0
  google_fonts: ^8.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^13.0.2
  geocoding: ^5.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  permission_handler: 11.3.1
  http: ^1.6.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.1.2
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  flutter_local_notifications: ^22.3.1
  socket_io_client: ^3.0.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/medicines/
    - assets/images/groceries/

  fonts:
    - family: Valley Sans
      fonts:
        - asset: assets/fonts/ValleySans-Regular.ttf
        - asset: assets/fonts/ValleySans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ValleySans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ValleySans-Bold.ttf
          weight: 700
